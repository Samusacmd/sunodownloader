name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Keystore (se presente nei secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Firma con il keystore personale"
          else
            echo "::warning::Secret KEYSTORE_BASE64 assente: APK firmato con chiave di debug (per aggiornare dovrai disinstallare)"
          fi

      - name: Compila APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Rinomina con la versione
        run: |
          V=$(grep -oP 'val appVersionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/SunoDownloader_v$V.apk"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: SunoDownloader_v${{ env.APP_VERSION }}
          path: out/*.apk

      - name: Pubblica nella pagina Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Suno Downloader v${{ env.APP_VERSION }}
          files: out/*.apk
          make_latest: true
